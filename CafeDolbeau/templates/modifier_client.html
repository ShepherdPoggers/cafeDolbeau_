<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Café Dolbeau — Modifier un client</title>
</head>
<body>
    <h1>Modifier un client</h1>
    <p>Renseignez au moins un moyen de contact : courriel ou téléphone.</p>
    <form method="post" action="{% url 'modifier_client' client.pk %}">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Enregistrer les modifications</button>
    </form>
    <a href="{% url 'accueil' %}">Annuler et revenir à l’accueil</a>
</body>
</html>
