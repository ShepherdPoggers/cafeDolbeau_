# Images construites par GitHub Actions ; aucun build sur EC2.
name: cafedolbeau_
x-app-environment: &id001
  DJANGO_SETTINGS_MODULE: config.settings
  SECRET_KEY: ${SECRET_KEY:-}
  SECRET_KEY_FILE: /app/secrets/SECRET_KEY
  DJANGO_DEBUG: 'false'
  DJANGO_ALLOWED_HOSTS: ${PUBLIC_DOMAIN:?PUBLIC_DOMAIN requis},localhost,127.0.0.1
  DJANGO_CSRF_TRUSTED_ORIGINS: https://${PUBLIC_DOMAIN:?PUBLIC_DOMAIN requis}
  DJANGO_SECURE_SSL_REDIRECT: 'false'
  DJANGO_SESSION_COOKIE_SECURE: 'true'
  DJANGO_CSRF_COOKIE_SECURE: 'true'
  DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-0}
  DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: ${DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS:-false}
  DJANGO_SECURE_HSTS_PRELOAD: ${DJANGO_SECURE_HSTS_PRELOAD:-false}
  DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
  CAFE_DB_ENGINE: postgresql
  POSTGRES_DB: ${POSTGRES_DB:-cafe_dolbeau}
  POSTGRES_USER: ${POSTGRES_USER:-cafe_dolbeau}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
  POSTGRES_PASSWORD_FILE: /app/secrets/POSTGRES_PASSWORD
  POSTGRES_HOST: db
  POSTGRES_PORT: '5432'
services:
  secrets:
    image: cafe-dolbeau-app:${IMAGE_TAG:?IMAGE_TAG requis}
    environment:
      SECRET_KEY: ${SECRET_KEY:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    command:
    - python
    - docker/preparer_secrets.py
    volumes:
    - runtime_secrets:/app/secrets
    restart: 'no'
  db:
    image: postgres:17.9-bookworm
    user: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cafe_dolbeau}
      POSTGRES_USER: ${POSTGRES_USER:-cafe_dolbeau}
      POSTGRES_PASSWORD_FILE: /app/secrets/POSTGRES_PASSWORD
    volumes:
    - postgres_data:/var/lib/postgresql/data
    - type: volume
      source: runtime_secrets
      target: /app/secrets
      read_only: true
      volume:
        nocopy: true
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    depends_on:
      secrets:
        condition: service_completed_successfully
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  init:
    image: cafe-dolbeau-app:${IMAGE_TAG:?IMAGE_TAG requis}
    environment: *id001
    command:
    - sh
    - -ec
    - python src/manage.py migrate --noinput && python src/manage.py collectstatic
      --noinput
    volumes:
    - staticfiles:/app/staticfiles
    - type: volume
      source: runtime_secrets
      target: /app/secrets
      read_only: true
      volume:
        nocopy: true
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'
  app:
    image: cafe-dolbeau-app:${IMAGE_TAG:?IMAGE_TAG requis}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      SECRET_KEY: ${SECRET_KEY:-}
      SECRET_KEY_FILE: /app/secrets/SECRET_KEY
      DJANGO_DEBUG: 'false'
      DJANGO_ALLOWED_HOSTS: ${PUBLIC_DOMAIN:?PUBLIC_DOMAIN requis},localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: https://${PUBLIC_DOMAIN:?PUBLIC_DOMAIN requis}
      DJANGO_SECURE_SSL_REDIRECT: 'false'
      DJANGO_SESSION_COOKIE_SECURE: 'true'
      DJANGO_CSRF_COOKIE_SECURE: 'true'
      DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-0}
      DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: ${DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS:-false}
      DJANGO_SECURE_HSTS_PRELOAD: ${DJANGO_SECURE_HSTS_PRELOAD:-false}
      DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
      CAFE_DB_ENGINE: postgresql
      POSTGRES_DB: ${POSTGRES_DB:-cafe_dolbeau}
      POSTGRES_USER: ${POSTGRES_USER:-cafe_dolbeau}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_PASSWORD_FILE: /app/secrets/POSTGRES_PASSWORD
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-30}
    depends_on:
      init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    volumes:
    - type: volume
      source: runtime_secrets
      target: /app/secrets
      read_only: true
      volume:
        nocopy: true
    healthcheck:
      test:
      - CMD
      - python
      - docker/healthcheck.py
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  proxy:
    image: cafe-dolbeau-proxy:${IMAGE_TAG:?IMAGE_TAG requis}
    environment:
      DJANGO_ALLOWED_HOSTS: ${PUBLIC_DOMAIN:?PUBLIC_DOMAIN requis},localhost,127.0.0.1
      PUBLIC_SCHEME: https
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?PUBLIC_DOMAIN requis}
    ports:
    - 0.0.0.0:80:8081
    volumes:
    - staticfiles:/app/staticfiles:ro
    - type: bind
      source: /opt/cafedolbeau/tls/served
      target: /etc/nginx/tls
      read_only: true
      bind:
        create_host_path: false
    depends_on:
      app:
        condition: service_healthy
        restart: true
    healthcheck:
      test:
      - CMD-SHELL
      - 'host=$${DJANGO_ALLOWED_HOSTS%%,*}; host=$${host#.}; [ "$$host" != ''*'' ]
        || host=localhost; wget -q -T 3 --header="Host: $$host" -O /dev/null http://127.0.0.1:8080/healthz'
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 run
    ports:
    - 127.0.0.1:2000:2000
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      proxy:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  runtime_secrets: null
  postgres_data: null
  staticfiles: null
