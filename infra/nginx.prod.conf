worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format cloudflare 'client=$http_cf_connecting_ip proxy=$remote_addr '
                     '[$time_local] "$request" $status $body_bytes_sent';
    access_log /dev/stdout cloudflare;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        server_name _;
        client_max_body_size 2m;

        location /static/ {
            alias /app/staticfiles/;
        }

        location / {
            proxy_pass http://app:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_redirect off;
        }
    }

    # Port publié sur EC2 ; le tunnel utilise exclusivement 8080.
    server {
        listen 8081;
        server_name _;
        location = /healthz {
            proxy_pass http://app:8000/healthz;
            proxy_set_header Host ${PUBLIC_DOMAIN};
            proxy_set_header X-Forwarded-Proto https;
        }
        location / {
            return 308 https://${PUBLIC_DOMAIN}$request_uri;
        }
    }
}
