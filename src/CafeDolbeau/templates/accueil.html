{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{% static 'CafeDolbeau/style.css' %}">
    <title>Café Dolbeau — Accueil</title>
    <script src="{% static 'CafeDolbeau/recherche.js' %}" defer></script>
</head>
<body class="cafe-page">
<header class="site-banner">
    <div class="site-banner-inner">
        <a class="site-name" href="{% url 'accueil' %}">Café Dolbeau</a>
        <form class="admin-access" method="get" action="{% url 'admin:index' %}">
            <button type="submit">Administration</button>
        </form>
    </div>
</header>
<main class="cafe-content">
    {% for message in messages %}
        <p role="status">{{ message }}</p>
    {% endfor %}

    <section aria-labelledby="titre-recherche">
        <h2 id="titre-recherche">Rechercher un client</h2>
        <form method="get" action="{% url 'accueil' %}" role="search" id="form-recherche">
            <label for="recherche">Nom, téléphone ou courriel</label>
            <div class="search-field">
                <input type="search" id="recherche" name="q" value="{{ recherche }}"
                       placeholder="Nom, téléphone ou courriel">
                <button type="button" id="effacer-recherche" aria-label="Effacer la recherche" title="Effacer la recherche">×</button>
            </div>
        </form>

        <p id="recherche-status" role="status"></p>
        <div id="resultats-recherche" class="table-scroll" role="region" aria-label="Liste des clients" tabindex="0" aria-live="polite" aria-busy="false">
            {% include "resultats_recherche.html" %}
        </div>
    </section>

    <h2>Ajouter un client</h2>
    <p>Renseignez au moins un moyen de contact : courriel ou téléphone.</p>
    <form method="post" action="{% url 'accueil' %}">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Ajouter le client</button>
    </form>

</main>
</body>
</html>
